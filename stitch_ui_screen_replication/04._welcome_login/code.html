<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-bright": "#fff8f7", "on-surface": "#28171a", "on-error": "#ffffff", "surface-tint": "#bc004b", "secondary": "#632ce5", "surface-container-high": "#ffe1e4", "on-primary-container": "#fffbff", "on-primary": "#ffffff", "surface-container-highest": "#fadbde", "surface-container-lowest": "#ffffff", "secondary-fixed-dim": "#cdbdff", "inverse-primary": "#ffb2be", "background": "#fff8f7", "primary-fixed-dim": "#ffb2be", "surface-variant": "#fadbde", "on-secondary-container": "#fcf6ff", "secondary-container": "#7c4dff", "on-tertiary-fixed": "#00210c", "surface-container": "#ffe9ea", "primary-fixed": "#ffd9de", "outline-variant": "#e4bdc2", "on-secondary": "#ffffff", "outline": "#8f6f73", "primary-container": "#e2165f", "on-tertiary-container": "#f6fff3", "surface": "#fff8f7", "on-error-container": "#93000a", "surface-container-low": "#fff0f1", "inverse-surface": "#3e2b2e", "on-surface-variant": "#5b3f43", "on-primary-fixed-variant": "#900038", "on-primary-fixed": "#400014", "tertiary-fixed": "#89faa8", "on-background": "#28171a", "surface-dim": "#f1d3d6", "tertiary": "#006a34", "on-secondary-fixed": "#20005f", "tertiary-fixed-dim": "#6ddd8e", "on-tertiary-fixed-variant": "#005227", "on-tertiary": "#ffffff", "error": "#ba1a1a", "secondary-fixed": "#e8deff", "on-secondary-fixed-variant": "#4f00d0", "error-container": "#ffdad6", "inverse-on-surface": "#ffecee", "tertiary-container": "#008644", "primary": "#b80049" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1.5rem", "full": "9999px" }, "spacing": { "margin-mobile": "20px", "xs": "8px", "xl": "32px", "sm": "12px", "gutter": "16px", "md": "16px", "margin-desktop": "64px", "lg": "24px", "base": "4px" }, "fontFamily": { "display-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "button": ["Plus Jakarta Sans"] }, "fontSize": { "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "button": ["16px", { "lineHeight": "20px", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface text-on-surface"><main class="min-h-screen"><div class="flex flex-col w-full px-margin-mobile pb-margin-mobile">
<!-- Header Space / Logo Placeholder -->
<div class="flex flex-col items-center justify-center pt-margin-desktop pb-xl">
<!-- Logo Simulation -->
<div class="flex items-center gap-xs mb-md">
<span class="font-display-lg text-on-surface tracking-tight">Zuste</span>
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
</div>
<h1 class="font-headline-md text-on-surface text-center mb-xs">Welcome Back!</h1>
<p class="font-body-md text-on-surface-variant text-center">Login to continue your journey</p>
</div>
<!-- Login Form -->
<div class="flex flex-col gap-md">
<!-- Email/Phone Input -->
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 peer" id="username" placeholder="Email or Phone" type="text">
<label class="absolute left-md top-sm font-label-md text-on-surface-variant/70 transition-all duration-200 peer-focus:-top-2 peer-focus:text-[10px] peer-focus:bg-surface-container-lowest peer-focus:px-1 peer-focus:text-primary opacity-0 peer-focus:opacity-100 -translate-y-1/2 bg-surface-container-lowest px-1" for="username">Email or Phone</label>
</div>
<!-- Password Input -->
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 peer" id="password" placeholder="Password" type="password">
<label class="absolute left-md top-sm font-label-md text-on-surface-variant/70 transition-all duration-200 peer-focus:-top-2 peer-focus:text-[10px] peer-focus:bg-surface-container-lowest peer-focus:px-1 peer-focus:text-primary opacity-0 peer-focus:opacity-100 -translate-y-1/2 bg-surface-container-lowest px-1" for="password">Password</label>
<button aria-label="Toggle password visibility" class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors focus:outline-none" onclick="
                const input = document.getElementById('password');
                const icon = this.querySelector('span');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            " type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-label-md text-secondary hover:text-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="w-full bg-primary text-on-primary font-button py-sm rounded-lg hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all duration-200 shadow-sm mt-xs overflow-hidden relative group">
<span class="relative z-10 flex items-center justify-center gap-xs">
                Login
                <span class="material-symbols-outlined text-[18px] opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out z-0"></div>
</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-sm my-xl">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-md text-on-surface-variant/70 px-2 uppercase tracking-wider">or continue with</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Social Login -->
<div class="flex gap-md w-full">
<button class="flex-1 flex items-center justify-center gap-sm bg-surface-container-lowest border border-outline-variant py-sm rounded-lg hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<!-- Google Icon SVG placeholder (using standard G colors for recognition, normally would use SVG asset) -->
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-button text-on-surface">Google</span>
</button>
<button class="flex-1 flex items-center justify-center gap-sm bg-surface-container-lowest border border-outline-variant py-sm rounded-lg hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<!-- Apple Icon SVG -->
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16.6 9.89C16.59 7.07 18.9 5.67 19 5.61c-1.3-1.92-3.32-2.19-4.04-2.22-1.72-.18-3.37 1.03-4.25 1.03-.89 0-2.25-1.01-3.69-.98-1.89.03-3.62 1.1-4.6 2.82C.39 9.8.7 14.28 2.72 17.21c1.01 1.45 2.19 3.1 3.73 3.04 1.48-.06 2.04-.97 3.84-.97 1.78 0 2.3.97 3.86.94 1.57-.03 2.59-1.5 3.58-2.95 1.15-1.68 1.62-3.3 1.65-3.39-.03-.01-3.17-1.22-3.18-4.83h.4V9.89zM13.78 3.56c.82-1 1.36-2.39 1.21-3.77-1.18.05-2.62.79-3.46 1.79-.75.87-1.4 2.3-1.22 3.65 1.33.1 2.65-.67 3.47-1.67z"></path>
</svg>
<span class="font-button text-on-surface">Apple</span>
</button>
</div>
<!-- Sign Up Link -->
<div class="mt-auto pt-xl flex justify-center">
<p class="font-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="font-label-md text-secondary hover:text-secondary-container transition-colors underline decoration-secondary/30 underline-offset-4" href="#">Sign Up</a>
</p>
</div>
</div></main></body></html>
