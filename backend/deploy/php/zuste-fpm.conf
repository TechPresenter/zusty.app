; =====================================================================
; Zusty — PHP-FPM pool (Hostinger VPS, Ubuntu, PHP 8.2)
;
; Install:
;   sudo cp deploy/php/zuste-fpm.conf /etc/php/8.2/fpm/pool.d/zustee.conf
;   sudo rm -f /etc/php/8.2/fpm/pool.d/www.conf      # remove the default pool
;   sudo php-fpm8.2 -t && sudo systemctl restart php8.2-fpm
;
; Sizing below assumes a 2 vCPU / 4 GB VPS. See the note on pm.max_children.
; =====================================================================

[zustee]

; --- process ownership ----------------------------------------------
; The socket is owned by the pool user and grouped to www-data so nginx can
; connect. The application files should be owned by this user, and storage/
; must be writable by it.
user  = zustee
group = zustee

listen       = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; --- process manager -------------------------------------------------
; `dynamic` suits bursty marketplace traffic better than `static`.
;
; pm.max_children is the single most important number here. Each PHP worker
; peaks around 64 MB with this app's memory_limit, so on a 4 GB box with ~1 GB
; reserved for MySQL and the OS: 3000 MB / 64 MB ≈ 46. We set 40 for headroom.
; If you resize the VPS, recompute this — setting it too high causes swapping,
; which is far worse than queueing.
pm                   = dynamic
pm.max_children      = 40
pm.start_servers     = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 16

; Recycle workers to bound the effect of any slow leak in a long-lived process.
pm.max_requests      = 500

; Exposed to the healthcheck only; nginx does not proxy this publicly.
pm.status_path       = /fpm-status
ping.path            = /fpm-ping

; --- timeouts ---------------------------------------------------------
; Must be <= fastcgi_read_timeout in the nginx config (120s) so nginx is not
; left holding a request whose worker has already been killed.
request_terminate_timeout = 115s

; Anything over 5s in this app is a bug; log it with a backtrace.
request_slowlog_timeout = 5s
slowlog                 = /var/log/php8.2-fpm/zustee-slow.log

; --- logging ----------------------------------------------------------
access.log    = /var/log/php8.2-fpm/zustee-access.log
access.format = "%R %{HTTP_HOST}e %m %r%Q%q %s %{mili}d %{kilo}M"

catch_workers_output = yes
decorate_workers_output = no

; --- PHP settings -----------------------------------------------------
; These override php.ini for this pool only.

; Never render an error to a visitor; the app's own handler formats a JSON
; envelope, and anything that escapes it must go to the log, not the response.
php_admin_flag[display_errors]         = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors]             = on
php_admin_value[error_log]             = /var/log/php8.2-fpm/zustee-error.log
php_admin_value[error_reporting]       = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Do not advertise the PHP version.
php_admin_flag[expose_php] = off

php_admin_value[memory_limit]       = 256M
php_admin_value[max_execution_time] = 110
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size]       = 68M
php_admin_value[max_input_vars]      = 2000

; Confine PHP to the application and its temp dir. A path traversal that
; escapes the app then cannot read /etc/passwd or another site's files.
; Adjust the first path if you deploy somewhere other than /var/www/zustee.
php_admin_value[open_basedir] = /var/www/zustee:/tmp:/usr/share/php

; Functions this application never calls, and that turn a file-write bug into
; remote code execution.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl

; Sessions: the admin panel is the only consumer. Secure + HttpOnly + SameSite
; are also set by the application, but a defence in depth costs nothing.
php_value[session.save_path]      = /var/lib/php/sessions
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure]   = on
php_admin_value[session.cookie_samesite] = Lax
php_admin_flag[session.use_strict_mode]  = on

; --- OPcache ----------------------------------------------------------
; The largest single performance win available on this stack. `validate
; _timestamps=0` means PHP never stats files — you MUST reload php-fpm on
; deploy (deploy.sh does this).
php_admin_flag[opcache.enable]                  = on
php_admin_value[opcache.memory_consumption]     = 192
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files]  = 20000
php_admin_value[opcache.validate_timestamps]    = 0
php_admin_value[opcache.save_comments]          = 1
php_admin_flag[opcache.enable_file_override]    = off

; --- realpath cache ---------------------------------------------------
; The autoloader resolves many paths per request; the default 16K cache
; thrashes on a codebase this size.
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl]  = 600
