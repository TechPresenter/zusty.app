<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zusty, the influencer marketplace where brands book verified creators.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zusty">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>Zusty</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #fff; }

    /*
      Launch splash while the app's code downloads: the same artwork the app's
      own splash shows (lib/app.dart), with a turning ring where the artwork
      draws its loader. Removed on Flutter's first frame.
    */
    #zusty-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff url("splash.jpg") center / cover no-repeat;
      transition: opacity 250ms cubic-bezier(0.33, 1, 0.68, 1);
    }
    #zusty-splash.done { opacity: 0; pointer-events: none; }
    #zusty-splash .ring {
      position: absolute;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(198, 1, 168, 0) 0deg, #c601a8 150deg, #ff7a59 290deg, rgba(255, 122, 89, 0) 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
      animation: zusty-spin 1.1s linear infinite;
    }
    @keyframes zusty-spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      #zusty-splash .ring { animation-duration: 2.6s; }
    }
  </style>
</head>
<body>
  <div id="zusty-splash" aria-hidden="true"><div class="ring"></div></div>
  <script>
    (function () {
      // The artwork's pixel size and its loading ring, as fractions of it.
      var W = 946, H = 1663, CX = 0.499, CY = 0.778, D = 0.097;
      var splash = document.getElementById('zusty-splash');
      var ring = splash.querySelector('.ring');

      // Place the ring with the same scale and offset as `background-size: cover`.
      function place() {
        var vw = window.innerWidth, vh = window.innerHeight;
        var s = Math.max(vw / W, vh / H);
        var w = W * s, h = H * s, d = D * w;
        ring.style.width = ring.style.height = d + 'px';
        ring.style.left = ((vw - w) / 2 + CX * w - d / 2) + 'px';
        ring.style.top = ((vh - h) / 2 + CY * h - d / 2) + 'px';
      }

      place();
      window.addEventListener('resize', place);
      window.addEventListener('flutter-first-frame', function () {
        window.removeEventListener('resize', place);
        splash.classList.add('done');
        setTimeout(function () { splash.remove(); }, 300);
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
