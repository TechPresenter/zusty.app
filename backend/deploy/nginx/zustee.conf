# =====================================================================
# Zusty — nginx server block (Hostinger VPS, Ubuntu + nginx + PHP-FPM)
#
# The repository also ships public/.htaccess for Apache/LiteSpeed shared
# hosting. This file is the nginx equivalent and enforces the SAME rules —
# if you change one, change the other.
#
# Install:
#   sudo cp deploy/nginx/zustee.conf /etc/nginx/sites-available/zustee.conf
#   sudo ln -s /etc/nginx/sites-available/zustee.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is issued by certbot; see deploy/README.md.
#
# IMPORTANT: `root` points at backend/public — never at the repository root.
# Everything above public/ (app, config, routes, database, storage, .env)
# must be outside the document root, which the `deny` blocks below also
# enforce as a second line of defence.
# =====================================================================

# --- rate limiting zones (shared across server blocks) ---------------
# Applied per-location below. These are a blunt instrument in front of the
# application's own throttle middleware, which does the precise per-user
# accounting; this only stops a flood from reaching PHP at all.
limit_req_zone $binary_remote_addr zone=zuste_api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=zuste_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=zuste_conn:10m;

# --- upstream --------------------------------------------------------
upstream zuste_php {
    server unix:/run/php/php8.2-fpm.sock;
    keepalive 16;
}

# --- HTTP: redirect everything to HTTPS ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zustee.com www.zustee.com;

    # Let certbot renew without a redirect loop.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- canonical host: drop the www prefix -----------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zustee.com;

    ssl_certificate     /etc/letsencrypt/live/zustee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zustee.com/privkey.pem;

    return 301 https://zustee.com$request_uri;
}

# --- main site -------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zustee.com;

    root /var/www/zustee/backend/public;
    index index.php index.html;

    # -----------------------------------------------------------------
    # TLS
    # -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/zustee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zustee.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # -----------------------------------------------------------------
    # Security headers
    #
    # Response::securityHeaders() sets these on PHP responses too; repeating
    # them here means static assets are covered as well. `always` applies them
    # to error responses, which is exactly when they matter most.
    # -----------------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "DENY"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                  always;

    # Do not advertise the nginx version.
    server_tokens off;

    # -----------------------------------------------------------------
    # Limits
    # -----------------------------------------------------------------
    # 64M upload + form overhead, matching upload_max_filesize in php.ini.
    client_max_body_size 68M;
    client_body_timeout  60s;
    client_header_timeout 20s;
    send_timeout         60s;
    limit_conn           zuste_conn 40;

    # -----------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------
    access_log /var/log/nginx/zustee.access.log;
    error_log  /var/log/nginx/zustee.error.log warn;

    # -----------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # -----------------------------------------------------------------
    # Hard denials — the nginx equivalent of the .htaccess deny rules.
    #
    # These paths should already be outside the document root. If a deploy
    # is ever laid out wrongly, these turn a catastrophic secret leak into
    # a 404.
    # -----------------------------------------------------------------
    location ~ ^/(app|config|routes|database|storage|scripts|languages|vendor|tests|deploy)/ {
        deny all;
        return 404;
    }

    # Dotfiles: .env, .git, .htaccess, editor backups.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Source, config, dumps and backups must never be served, wherever they sit.
    location ~* \.(env|ini|log|sh|sql|lock|md|yml|yaml|bak|old|dist|example|twig|tpl)$ {
        deny all;
        return 404;
    }

    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json)$ {
        deny all;
        return 404;
    }

    # An uploaded .php is remote code execution. Uploads are validated by
    # UploadService, but a web server that refuses to execute anything in the
    # upload tree means a validation bypass is still not fatal.
    location ~* ^/uploads/.*\.(php\d?|phtml|phar|cgi|pl|py|sh)$ {
        deny all;
        return 404;
    }

    # -----------------------------------------------------------------
    # Static assets
    # -----------------------------------------------------------------
    location ^~ /uploads/ {
        # try_files only — never hand this directory to PHP.
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # -----------------------------------------------------------------
    # Admin panel front controller
    # -----------------------------------------------------------------
    location /admin {
        limit_req zone=zuste_api burst=40 nodelay;
        try_files $uri $uri/ /admin/index.php$is_args$args;
    }

    # -----------------------------------------------------------------
    # API
    # -----------------------------------------------------------------
    # Auth endpoints get the tighter zone: credential stuffing arrives here.
    location ~ ^/api/v1/auth/(login|register|otp|forgot-password|reset-password) {
        limit_req zone=zuste_auth burst=10 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    # Gateway webhooks must not be rate-limited into failure — a dropped
    # webhook is a payment the system never learns about. They are already
    # authenticated by signature.
    location ^~ /api/v1/webhooks/ {
        try_files $uri /index.php$is_args$args;
    }

    location /api/ {
        limit_req zone=zuste_api burst=60 nodelay;

        # API responses are per-user; never let a proxy cache them.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        try_files $uri /index.php$is_args$args;
    }

    # -----------------------------------------------------------------
    # Everything else → the API front controller
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # -----------------------------------------------------------------
    # PHP
    # -----------------------------------------------------------------
    location ~ ^/(index|admin/index)\.php(/|$) {
        include                 fastcgi_params;
        fastcgi_pass            zuste_php;
        fastcgi_index           index.php;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # nginx does not forward the Authorization header to FastCGI by
        # default. Without this, EVERY Bearer-token request is anonymous.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # Behind a proxy or CDN these tell the app the real scheme and client,
        # which the HTTPS check and rate limiter both depend on.
        fastcgi_param HTTPS             $https if_not_empty;
        fastcgi_param REQUEST_SCHEME    $scheme;

        fastcgi_read_timeout    120s;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
        fastcgi_hide_header     X-Powered-By;
    }

    # Any other .php file is not a front controller and must not execute.
    # This is what stops an uploaded or stray script from ever running.
    location ~ \.php$ {
        deny all;
        return 404;
    }
}
